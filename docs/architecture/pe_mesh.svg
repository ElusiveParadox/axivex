<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Helvetica,Arial,sans-serif" font-size="12">
  <defs><marker id="e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fbf"/></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0a8a6a"/></marker></defs>
  <rect x="1" y="1" width="638" height="558" fill="#fff" stroke="#ccd"/>
  <text x="320" y="22" text-anchor="middle" font-weight="bold" font-size="15">4x4 PE mesh (output-stationary)</text>
  <g id="mesh">
  <!-- PEs generated by hand: x=110+150*j, y=60+120*i -->
  <g stroke="#334" fill="#f6f6ff">
    <rect x="110" y="60" width="90" height="70" rx="6"/><rect x="260" y="60" width="90" height="70" rx="6"/><rect x="410" y="60" width="90" height="70" rx="6"/><rect x="560" y="60" width="60" height="70" rx="6"/>
    <rect x="110" y="180" width="90" height="70" rx="6"/><rect x="260" y="180" width="90" height="70" rx="6"/><rect x="410" y="180" width="90" height="70" rx="6"/><rect x="560" y="180" width="60" height="70" rx="6"/>
    <rect x="110" y="300" width="90" height="70" rx="6"/><rect x="260" y="300" width="90" height="70" rx="6"/><rect x="410" y="300" width="90" height="70" rx="6"/><rect x="560" y="300" width="60" height="70" rx="6"/>
    <rect x="110" y="420" width="90" height="70" rx="6"/><rect x="260" y="420" width="90" height="70" rx="6"/><rect x="410" y="420" width="90" height="70" rx="6"/><rect x="560" y="420" width="60" height="70" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="155" y="90">PE(0,0)</text><text x="305" y="90">PE(0,1)</text><text x="455" y="90">PE(0,2)</text><text x="590" y="90">PE(0,3)</text>
    <text x="155" y="210">PE(1,0)</text><text x="305" y="210">PE(1,1)</text><text x="455" y="210">PE(1,2)</text><text x="590" y="210">PE(1,3)</text>
    <text x="155" y="330">PE(2,0)</text><text x="305" y="330">PE(2,1)</text><text x="455" y="330">PE(2,2)</text><text x="590" y="330">PE(2,3)</text>
    <text x="155" y="450">PE(3,0)</text><text x="305" y="450">PE(3,1)</text><text x="455" y="450">PE(3,2)</text><text x="590" y="450">PE(3,3)</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#555">
    <text x="155" y="110">acc[i][j] = C[i][j]</text><text x="305" y="110">acc</text><text x="455" y="110">acc</text><text x="590" y="110">acc</text>
  </g></g>
  <g stroke="#1f5fbf" stroke-width="1.6" marker-end="url(#e)">
    <path d="M40 95 H110"/><path d="M200 95 H260"/><path d="M350 95 H410"/><path d="M500 95 H560"/>
    <path d="M40 215 H110"/><path d="M200 215 H260"/><path d="M350 215 H410"/><path d="M500 215 H560"/>
    <path d="M40 335 H110"/><path d="M200 335 H260"/><path d="M350 335 H410"/><path d="M500 335 H560"/>
    <path d="M40 455 H110"/><path d="M200 455 H260"/><path d="M350 455 H410"/><path d="M500 455 H560"/></g>
  <g stroke="#0a8a6a" stroke-width="1.6" marker-end="url(#s)">
    <path d="M155 40 V60"/><path d="M305 40 V60"/><path d="M455 40 V60"/><path d="M590 40 V60"/>
    <path d="M155 130 V180"/><path d="M305 130 V180"/><path d="M455 130 V180"/><path d="M590 130 V180"/>
    <path d="M155 250 V300"/><path d="M305 250 V300"/><path d="M455 250 V300"/><path d="M590 250 V300"/>
    <path d="M155 370 V420"/><path d="M305 370 V420"/><path d="M455 370 V420"/><path d="M590 370 V420"/></g>
  <text x="8" y="90" fill="#1f5fbf" font-size="11">A[0][t]</text><text x="8" y="210" fill="#1f5fbf" font-size="11">A[1][t-1]</text><text x="8" y="330" fill="#1f5fbf" font-size="11">A[2][t-2]</text><text x="8" y="450" fill="#1f5fbf" font-size="11">A[3][t-3]</text>
  <text x="120" y="38" fill="#0a8a6a" font-size="11">B[t][0]</text><text x="265" y="38" fill="#0a8a6a" font-size="11">B[t-1][1]</text><text x="415" y="38" fill="#0a8a6a" font-size="11">B[t-2][2]</text><text x="545" y="38" fill="#0a8a6a" font-size="11">B[t-3][3]</text>
  <text x="320" y="530" text-anchor="middle" fill="#445">Blue: A moves east. Green: B moves south. One registered hop per clock. Partial sums never move.</text>
  <text x="320" y="548" text-anchor="middle" fill="#445">PE(i,j) sees A[i][k] and B[k][j] together at t = i + j + k.</text>
</svg>
