<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica,Arial,sans-serif" font-size="13">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334"/></marker></defs>
  <rect x="1" y="1" width="898" height="378" fill="#fff" stroke="#ccd"/>
  <text x="450" y="22" text-anchor="middle" font-weight="bold" font-size="16">AXIVEX high-level architecture (axivex_top)</text>
  <rect x="20" y="150" width="110" height="90" rx="6" fill="#eef" stroke="#334"/><text x="75" y="190" text-anchor="middle">Host /</text><text x="75" y="208" text-anchor="middle">testbench</text>
  <rect x="170" y="60" width="130" height="40" rx="6" fill="#dfe" stroke="#334"/><text x="235" y="85" text-anchor="middle">matrix_data_interface</text>
  <rect x="170" y="130" width="130" height="50" rx="6" fill="#dde8ff" stroke="#334"/><text x="235" y="152" text-anchor="middle">input_buffers</text><text x="235" y="168" text-anchor="middle">A, B (INT8 x16 each)</text>
  <rect x="340" y="60" width="200" height="40" rx="6" fill="#dfe" stroke="#334"/><text x="440" y="85" text-anchor="middle">array_controller (FSM)</text>
  <rect x="340" y="130" width="130" height="110" rx="6" fill="#dfe" stroke="#334"/><text x="405" y="175" text-anchor="middle">skew_scheduler</text><text x="405" y="192" text-anchor="middle">A[i][t-i], B[t-j][j]</text>
  <rect x="520" y="120" width="210" height="205" rx="6" fill="#f6f6ff" stroke="#334" stroke-dasharray="5 3"/><text x="625" y="140" text-anchor="middle">systolic_array_4x4</text>
  <g fill="#fff" stroke="#334"><rect x="540" y="155" width="40" height="30"/><rect x="590" y="155" width="40" height="30"/><rect x="640" y="155" width="40" height="30"/><rect x="690" y="155" width="30" height="30"/>
  <rect x="540" y="195" width="40" height="30"/><rect x="590" y="195" width="40" height="30"/><rect x="640" y="195" width="40" height="30"/><rect x="690" y="195" width="30" height="30"/>
  <rect x="540" y="235" width="40" height="30"/><rect x="590" y="235" width="40" height="30"/><rect x="640" y="235" width="40" height="30"/><rect x="690" y="235" width="30" height="30"/>
  <rect x="540" y="275" width="40" height="28"/><rect x="590" y="275" width="40" height="28"/><rect x="640" y="275" width="40" height="28"/><rect x="690" y="275" width="30" height="28"/></g>
  <text x="625" y="300" text-anchor="middle" font-size="10" fill="#fff">.</text>
  <text x="625" y="334" text-anchor="middle" font-size="11">16 x processing_element (MAC + acc)</text>
  <rect x="770" y="150" width="110" height="90" rx="6" fill="#dde8ff" stroke="#334"/><text x="825" y="185" text-anchor="middle">output_buffer</text><text x="825" y="203" text-anchor="middle">C (INT32 x16)</text>
  <g stroke="#334" fill="none" marker-end="url(#a)">
    <path d="M130 175 H170"/><path d="M130 160 V80 H170"/><path d="M300 155 H340"/><path d="M440 100 V130"/><path d="M470 185 H520"/>
    <path d="M730 215 H770"/><path d="M825 150 V114 H520 V100"/><path d="M340 80 H300"/><path d="M540 80 H625 V120"/>
    <path d="M770 235 H130 V240" stroke-dasharray="3 3"/></g>
  <text x="145" y="72" font-size="11">start</text><text x="485" y="178" font-size="11">A,B lanes</text><text x="545" y="74" font-size="11">clear_acc</text><text x="305" y="74" font-size="11">busy</text><text x="680" y="110" font-size="11">all_captured_next</text>
  <text x="740" y="208" font-size="11">result</text><text x="450" y="104" font-size="11" dx="6">run, cycle_count</text><text x="150" y="262" font-size="11" fill="#445">C, c_valid, busy, done, start_rejected back to host</text>
  <text x="20" y="360" font-size="12" fill="#445">Data flow: Host -> input_buffers -> skew_scheduler -> PE mesh -> output_buffer -> Host. Control: matrix_data_interface -> array_controller.</text>
</svg>
